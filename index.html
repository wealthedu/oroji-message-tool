<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오로지교육 · 고객 관리 메시지</title>
<style>html,body{margin:0;padding:0;background:#f4f2fd;-webkit-text-size-adjust:100%}</style>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" crossorigin="anonymous"></script>
</head>
<body>
<!-- ============================================================
  오로지교육 · 고객 접촉 문자함 (MVP v5)
  - 카테고리별 멘트 12개 + 안부에 쾌유(입원/수술/치료) 메시지
  - 메시지 텍스트를 카톡 친구 선택창으로 바로 전송 / 복사
  - 사용자가 멘트 수정·추가·삭제 가능 (브라우저 저장)
  아임웹 [코드 삽입] 블록에 통째로 붙여넣어 사용하세요.
  멘트 추가/수정은 아래 OROJI_TEMPLATES 배열을 고치거나, 화면에서 직접 편집하세요.
============================================================ -->
<div id="oroji-msg-app">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
    #oroji-msg-app *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    #oroji-msg-app{
      --bg:#f4f2fd; --card:#ffffff; --line:#ebe7f7; --text:#3a3340; --sub:#9d96b4;
      --brand:#8b7cf6; --brand-2:#b89bff; --brand-deep:#6d5be0; --brand-soft:#f1ecff;
      --calm:#a79df0; --gold:#ffb020; --ok:#2bb673;
      font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
      color:var(--text); background:var(--bg); max-width:480px; margin:0 auto;
      padding:0 0 44px; line-height:1.5; -webkit-text-size-adjust:100%;
    }
    #oroji-msg-app .wrap{padding:0 15px}

    /* 히어로 */
    #oroji-msg-app .hero{background:
        radial-gradient(135% 95% at 84% 72%, rgba(178,152,255,.55) 0%, rgba(178,152,255,0) 52%),
        radial-gradient(120% 85% at 8% 2%, rgba(124,99,235,.45) 0%, rgba(124,99,235,0) 50%),
        linear-gradient(158deg,#6a4ee0 0%,#5836cf 44%,#3f23a8 100%);
      padding:30px 20px 26px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
    #oroji-msg-app .hero::after{content:"";position:absolute;right:-40px;top:24px;width:210px;height:210px;background:radial-gradient(circle,rgba(193,168,255,.38) 0%,rgba(193,168,255,0) 70%);border-radius:50%}
    #oroji-msg-app .hero::before{content:"";position:absolute;left:-34px;bottom:-44px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 70%);border-radius:50%}
    #oroji-msg-app .hero .kicker{font-size:12px;font-weight:700;color:rgba(255,255,255,.92);letter-spacing:.3px;position:relative;z-index:1}
    #oroji-msg-app .brand-logo{height:26px;width:auto;display:block;position:relative;z-index:2;margin:0 0 22px 0}
    #oroji-msg-app .wordmark{font-size:20px;font-weight:800;color:#fff;letter-spacing:1px;position:relative;z-index:2;margin:0 0 22px 0}
    #oroji-msg-app .hero h1{font-size:23px;font-weight:800;letter-spacing:-.5px;margin-top:4px;color:#fff;position:relative;z-index:1}
    #oroji-msg-app .hero p{font-size:13px;color:rgba(255,255,255,.92);margin-top:5px;position:relative;z-index:1}

    /* 이름 카드 */
    #oroji-msg-app .names{display:flex;gap:10px;background:var(--card);border-radius:18px;padding:15px;
      margin:22px 15px 0;box-shadow:0 6px 20px rgba(139,124,246,.14);border:1px solid var(--line)}
    #oroji-msg-app .names .fld{flex:1;background:#f6f4fd;border-radius:13px;padding:11px 14px;border:1px solid transparent;transition:.15s}
    #oroji-msg-app .names .fld:focus-within{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(139,124,246,.12)}
    #oroji-msg-app .names label{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--sub);font-weight:700;margin-bottom:2px}
    #oroji-msg-app .names input{width:100%;border:0;outline:0;font-size:15px;background:transparent;color:var(--text);font-weight:600;font-family:inherit}
    #oroji-msg-app .names input::placeholder{color:#cdc6de;font-weight:500}
    #oroji-msg-app .hint{font-size:11.5px;color:var(--sub);margin:7px 18px 0}

    /* 검색 */
    #oroji-msg-app .search{position:relative;margin:14px 0 14px}
    #oroji-msg-app .search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;
      padding:12px 16px 12px 42px;font-size:15px;outline:0;color:var(--text);font-family:inherit;box-shadow:0 3px 10px rgba(139,124,246,.08);transition:.15s}
    #oroji-msg-app .search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(139,124,246,.12)}
    #oroji-msg-app .search input::placeholder{color:#c2bcd4}
    #oroji-msg-app .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.4}

    /* 카테고리 버튼 */
    #oroji-msg-app .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:10px;-ms-overflow-style:none;scrollbar-width:none}
    #oroji-msg-app .chips::-webkit-scrollbar{display:none}
    #oroji-msg-app .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:#8a7f9f;
      font-size:13.5px;font-weight:700;padding:9px 15px;border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap;font-family:inherit;box-shadow:0 2px 6px rgba(139,124,246,.07)}
    #oroji-msg-app .chip:active{transform:scale(.96)}
    #oroji-msg-app .chip.on{background:linear-gradient(135deg,var(--brand),var(--brand-2));border-color:transparent;color:#fff;box-shadow:0 5px 14px rgba(139,124,246,.34)}

    /* 상단 액션바 */
    #oroji-msg-app .bar{display:flex;align-items:center;justify-content:space-between;margin:0 4px 11px}
    #oroji-msg-app .count{font-size:12.5px;color:var(--sub);font-weight:600}
    #oroji-msg-app .count b{color:var(--brand-deep);font-weight:800}
    #oroji-msg-app .addbtn{border:1px dashed #c9bff2;background:#faf8ff;color:var(--brand-deep);font-family:inherit;
      font-size:12px;font-weight:700;padding:7px 12px;border-radius:10px;cursor:pointer;transition:.15s}
    #oroji-msg-app .addbtn:active{transform:scale(.96)}

    /* 메인: 카테고리별 가로 줄 */
    #oroji-msg-app .home{display:block}
    #oroji-msg-app .section{margin-bottom:20px}
    #oroji-msg-app .rowhead{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
    #oroji-msg-app .rowhead .rt{font-size:15.5px;font-weight:800;color:#3a3340;display:flex;align-items:center;gap:6px}
    #oroji-msg-app .rowhead .more{font-size:12.5px;color:var(--brand-deep);font-weight:700;background:none;border:0;cursor:pointer;font-family:inherit;padding:4px 2px;display:flex;align-items:center;gap:2px}
    #oroji-msg-app .hrow{display:flex;gap:11px;overflow-x:auto;padding:2px 2px 9px;-ms-overflow-style:none;scrollbar-width:none;scroll-snap-type:x mandatory}
    #oroji-msg-app .hrow::-webkit-scrollbar{display:none}
    #oroji-msg-app .hrow .card{flex:0 0 236px;scroll-snap-align:start}

    /* 카드 그리드(2열) */
    #oroji-msg-app .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
    #oroji-msg-app .card{border-radius:20px;padding:16px 15px 14px;border:1.5px solid rgba(109,91,224,.06);
      box-shadow:0 6px 18px rgba(139,124,246,.13);display:flex;flex-direction:column;transition:.15s}
    #oroji-msg-app .card .top{display:flex;align-items:center;gap:6px;margin-bottom:10px}
    #oroji-msg-app .tag{font-size:12px;font-weight:800;padding:4px 12px;border-radius:999px;letter-spacing:.2px}
    #oroji-msg-app .mine{font-size:9px;font-weight:800;color:#fff;background:#b6a8e8;padding:2px 6px;border-radius:6px;margin-left:3px}
    #oroji-msg-app .star{margin-left:auto;cursor:pointer;font-size:19px;line-height:1;color:#cdbfd6;user-select:none;transition:.15s}
    #oroji-msg-app .star:active{transform:scale(1.25)}
    #oroji-msg-app .star.on{color:var(--gold)}
    #oroji-msg-app .body{font-size:13.6px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:break-word;color:#5b5263;line-height:1.65;flex:1}
    #oroji-msg-app .body b{color:var(--brand-deep);font-weight:800}

    /* 액션 */
    #oroji-msg-app .acts{margin-top:13px;display:flex;flex-direction:column;gap:8px}
    #oroji-msg-app .btn-main{width:100%;border:0;border-radius:14px;background:linear-gradient(135deg,#a78bfa 0%,#8b7cf6 100%);color:#fff;
      font-size:14px;font-weight:700;padding:13px;cursor:pointer;transition:.15s;font-family:inherit;
      box-shadow:0 5px 14px rgba(139,124,246,.32);display:flex;align-items:center;justify-content:center;gap:7px}
    #oroji-msg-app .btn-main:active{transform:scale(.97);background:linear-gradient(135deg,#9a7bf5 0%,#7d6bf0 100%)}
    #oroji-msg-app .btn-main svg{width:20px;height:20px;flex:0 0 auto;border-radius:6px}
    #oroji-msg-app .subrow{display:flex;gap:7px}
    #oroji-msg-app .btn-ghost{flex:1;background:#fff;border:1px solid rgba(109,91,224,.14);color:#7d7390;
      border-radius:12px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
    #oroji-msg-app .btn-ghost:active{transform:scale(.96)}
    #oroji-msg-app .btn-ghost.done{background:#dff5ea;border-color:#bfe9d4;color:#1f9d61}

    /* 편집 폼 */
    #oroji-msg-app .edit textarea{width:100%;min-height:120px;border:1px solid #d6cdf2;border-radius:12px;padding:10px;
      font-size:13px;font-family:inherit;color:var(--text);line-height:1.55;outline:0;resize:vertical;background:#fff}
    #oroji-msg-app .edit textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(139,124,246,.12)}
    #oroji-msg-app .vars{display:flex;gap:5px;margin:7px 0}
    #oroji-msg-app .vars button{flex:1;background:#f1ecff;border:0;color:var(--brand-deep);border-radius:8px;padding:6px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
    #oroji-msg-app .erow{display:flex;gap:6px;margin-top:6px}
    #oroji-msg-app .erow button{flex:1;border:0;border-radius:9px;padding:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
    #oroji-msg-app .erow .save{background:var(--brand);color:#fff}
    #oroji-msg-app .erow .cancel{background:#efecf6;color:#7d7390}
    #oroji-msg-app .erow .reset{background:#fff3e0;color:#d98a1a}
    #oroji-msg-app .erow .del{background:#ffe9ec;color:#e0556b}
    #oroji-msg-app .ehint{font-size:10.5px;color:var(--sub);margin-top:5px;line-height:1.5}

    #oroji-msg-app .empty{grid-column:1/-1;text-align:center;color:var(--sub);font-size:14px;padding:46px 20px;line-height:1.7}
    #oroji-msg-app .empty .emoji{font-size:34px;display:block;margin-bottom:10px}

    /* 토스트 */
    #oroji-msg-app .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#4a3f55;color:#fff;
      font-size:14px;font-weight:700;padding:13px 22px;border-radius:999px;opacity:0;pointer-events:none;
      transition:.28s cubic-bezier(.2,.8,.2,1);z-index:99999;box-shadow:0 10px 30px rgba(74,63,85,.32);display:flex;align-items:center;gap:8px;max-width:88%;text-align:center}
    #oroji-msg-app .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* 전송 미리보기 모달 */
    #oroji-msg-app .modal{position:fixed;inset:0;background:rgba(40,33,58,.55);backdrop-filter:blur(3px);
      display:none;align-items:center;justify-content:center;z-index:99998;padding:20px}
    #oroji-msg-app .modal.show{display:flex}
    #oroji-msg-app .sheet{background:var(--line);border-radius:22px;padding:16px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
    #oroji-msg-app .sheet h3{font-size:15px;font-weight:800;text-align:center;margin-bottom:12px;color:var(--text)}
    #oroji-msg-app .sheet .preview{background:#9bbbd4;border-radius:14px;padding:16px 12px;max-height:52vh;overflow:auto;display:flex;justify-content:flex-end}
    #oroji-msg-app .sheet .bubble{background:#fef01b;border-radius:16px 4px 16px 16px;padding:11px 13px;font-size:14px;line-height:1.62;color:#191600;white-space:pre-wrap;word-break:break-word;max-width:86%;box-shadow:0 1px 2px rgba(0,0,0,.12)}
    #oroji-msg-app .pcount{font-size:12px;text-align:right;margin:7px 3px 0;color:#8a83a6;font-weight:600}
    #oroji-msg-app .pcount.warn{color:#d1801f}
    #oroji-msg-app .pcount.over{color:#e0344b;font-weight:800}
    #oroji-msg-app .phint{display:none;margin:9px 2px 0;padding:9px 11px;border-radius:10px;background:#fff6d9;
      border:1px solid #ffe7a0;color:#8a6a12;font-size:11.8px;line-height:1.5;font-weight:600}
    #oroji-msg-app .phint.show{display:block}
    #oroji-msg-app .mbtns{display:flex;gap:8px;margin-top:14px}
    #oroji-msg-app .mbtns button{flex:1;border:0;border-radius:12px;padding:12px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s}
    #oroji-msg-app .mbtns .send{background:#fee500;color:#3a1d1d;box-shadow:0 6px 16px rgba(254,229,0,.4);display:flex;align-items:center;justify-content:center;gap:6px}
    #oroji-msg-app .mbtns .send svg{width:19px;height:19px}
    #oroji-msg-app .mbtns .down{background:#f1ecff;color:var(--brand-deep)}
    #oroji-msg-app .mbtns button:active{transform:scale(.97)}
    #oroji-msg-app .mclose{margin-top:9px;width:100%;background:none;border:0;color:var(--sub);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;padding:6px}

    /* 애니메이션 / 인터랙션 */
    @keyframes oroji-cardin{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
    #oroji-msg-app .card.anim{animation:oroji-cardin .34s cubic-bezier(.2,.8,.2,1) both}
    @media (hover:hover){
      #oroji-msg-app .card{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s}
      #oroji-msg-app .card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(139,124,246,.2)}
      #oroji-msg-app .chip:hover{border-color:var(--brand-2)}
    }
    @keyframes oroji-pop{0%{transform:scale(1)}40%{transform:scale(1.5)}70%{transform:scale(.82)}100%{transform:scale(1)}}
    #oroji-msg-app .star.pop{animation:oroji-pop .42s cubic-bezier(.2,.8,.2,1)}
    @keyframes oroji-modalin{from{opacity:0}to{opacity:1}}
    @keyframes oroji-sheetin{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
    #oroji-msg-app .modal.show{animation:oroji-modalin .2s ease both}
    #oroji-msg-app .modal.show .sheet{animation:oroji-sheetin .34s cubic-bezier(.2,.8,.2,1) both}
    @keyframes oroji-pulse{0%{box-shadow:0 0 0 0 rgba(43,182,115,.45)}100%{box-shadow:0 0 0 11px rgba(43,182,115,0)}}
    #oroji-msg-app .btn-ghost.done{animation:oroji-pulse .6s ease-out}
    @media (prefers-reduced-motion:reduce){
      #oroji-msg-app *,#oroji-msg-app .card.anim,#oroji-msg-app .modal.show,#oroji-msg-app .modal.show .sheet,#oroji-msg-app .star.pop,#oroji-msg-app .btn-ghost.done{animation:none!important;transition:none!important}
    }
  </style>

  // 카카오톡 말풍선 아이콘(모달 노란버튼용 · 진한 단색)

  // =====================================================

  var defaults = OROJI_TEMPLATES.map(function(t,i){ return {id:'d'+i, cat:t.cat, def:t.text}; });
  function allItems(){
    var arr = defaults.map(function(d){ return {id:d.id, cat:d.cat, text:overrides[d.id]!=null?overrides[d.id]:d.def, isCustom:false, hasOvr:overrides[d.id]!=null}; });

  // ---------- 칩 ----------

  function visible(){

      else if(state.cat!=='전체'){ if(t.cat!==state.cat) return false; }
      if(q && t.text.indexOf(q)<0 && t.cat.indexOf(q)<0) return false;
      return true;
    });
  }

  // ---------- 렌더 ----------
  var HOME_LIMIT=6; // 메인에서 카테고리별로 보여줄 개수

  function render(){
    renderChips();
    var q=state.q.trim();
    // 메인(전체 + 검색 없음): 카테고리별 가로 줄
    if(state.cat==='전체' && !q && !editingId){
      countEl.innerHTML='전체 멘트 <b>'+allItems().length+'</b>개';
      renderHome(); return;
    }
    gridEl.className='grid';
    var items=visible();
    countEl.innerHTML = items.length ? '멘트 <b>'+items.length+'</b>개' : '';
    gridEl.innerHTML='';
    if(items.length===0){
      var e=document.createElement('div'); e.className='empty';
      e.innerHTML = state.cat==='⭐ 즐겨찾기'
        ? '<span class="emoji">⭐</span>즐겨찾기한 멘트가 없어요.<br>카드의 ☆를 눌러 모아보세요.'
        : '<span class="emoji">🔍</span>결과가 없어요.';
      gridEl.appendChild(e); return;
    }
    items.forEach(function(t){ gridEl.appendChild(editingId===t.id ? editCard(t) : viewCard(t)); });
    if(!editingId) staggerIn();
    if(editingId){ var ta=gridEl.querySelector('textarea'); if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); } }

  function renderHome(){
    gridEl.className='home';
    gridEl.innerHTML='';
    realCats().forEach(function(cat){
      var all=allItems().filter(function(t){ return t.cat===cat; });

      var head=document.createElement('div'); head.className='rowhead';
      head.innerHTML='<span class="rt">'+m.emo+' '+esc(cat)+'</span>'+

      var row=document.createElement('div'); row.className='hrow';
      all.slice(0,HOME_LIMIT).forEach(function(t){ row.appendChild(viewCard(t)); });
      sec.appendChild(head); sec.appendChild(row); gridEl.appendChild(sec);

    staggerIn();
  }
  function scrollTopApp(){ try{ root.scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){} }

  function viewCard(t){
    var m=meta(t.cat), isFav=favs.indexOf(t.id)>=0;
    var card=document.createElement('div'); card.className='card'; card.style.background='#fff'; card.style.borderColor=m.bg;
    card.innerHTML=
      '<div class="top"><span class="tag" style="background:'+m.tagbg+';color:'+m.tagfg+'">'+esc(t.cat)+'</span>'+
      (t.isCustom?'<span class="mine">내 멘트</span>':(t.hasOvr?'<span class="mine">수정됨</span>':''))+
      '<span class="star'+(isFav?' on':'')+'">'+(isFav?'★':'☆')+'</span></div>'+
      '<div class="body">'+hi(t.text)+'</div>'+

      '</div>';
    card.querySelector('.star').onclick=function(){ var i=favs.indexOf(t.id), nowFav; if(i>=0){favs.splice(i,1);nowFav=false;} else {favs.push(t.id);nowFav=true;} save(K_FAV,favs);
      if(state.cat==='⭐ 즐겨찾기'){ render(); return; }
      this.classList.toggle('on',nowFav); this.textContent=nowFav?'★':'☆';

    card.querySelector('.btn-main').onclick=function(){ sendText(fill(t.text), t.cat); };
    card.querySelector('.cp').onclick=function(){ var b=this; copyText(fill(t.text),function(){ b.classList.add('done'); b.textContent='복사됨 ✓'; toast('복사됐어요!'); setTimeout(function(){ b.classList.remove('done'); b.textContent='복사'; },1400); }); };
    card.querySelector('.ed').onclick=function(){ editingId=t.id; render(); };

  function editCard(t){
    var m=meta(t.cat);
    var card=document.createElement('div'); card.className='card edit'; card.style.background='#fff'; card.style.borderColor=m.bg;
    card.innerHTML=
      '<div class="top"><span class="tag" style="background:'+m.tagbg+';color:'+m.tagfg+'">'+esc(t.cat)+'</span></div>'+

        '<button class="cancel">취소</button>'+

      else{ var d=defaults.filter(function(x){return x.id===t.id;})[0]; if(d && val===d.def){ delete overrides[t.id]; } else { overrides[t.id]=val; } save(K_OVR,overrides); }
      editingId=null; toast('저장됐어요!'); render();
    };
    card.querySelector('.cancel').onclick=function(){
      if(t.isCustom && !t.text.trim()){ customs=customs.filter(function(x){return x.id!==t.id;}); save(K_CUS,customs); }

    var db=card.querySelector('.del'); if(db) db.onclick=function(){ customs=customs.filter(function(x){return x.id!==t.id;}); save(K_CUS,customs); var fi=favs.indexOf(t.id); if(fi>=0){favs.splice(fi,1);save(K_FAV,favs);} editingId=null; toast('삭제됐어요'); render(); };

  // ---------- 멘트 추가 ----------

  // ---------- 전송 미리보기 ----------
  function updateCount(len){

  }
  function showHint(msg){ hintEl.textContent=msg; hintEl.classList.add('show'); }
  function hideHint(){ hintEl.classList.remove('show'); hintEl.textContent=''; }

  function openSend(t){
    curShare={ text: fill(t.text) };
    previewEl.textContent=curShare.text;   // textContent라 줄바꿈 유지 + HTML 주입 방지

    modalEl.classList.add('show');

  function kakaoReady(){ return !!(window.Kakao && Kakao.isInitialized && Kakao.isInitialized() && Kakao.Share); }
  // 카카오는 개발자센터에 등록된 도메인에서만 친구 선택창을 열어준다. file:// 은 항상 거부된다.
  // 미등록 host 에서 sendDefault 를 부르면 팝업 안에서 조용히 실패하므로, 아예 시도하지 않는 편이 안전하다.
  // "https://Site.netlify.app/" 처럼 적어도 동작하도록 host 만 남기고 소문자로 맞춘다
  function normHost(s){ return String(s).trim().toLowerCase().replace(/^https?:\/\//,'').replace(/\/.*$/,''); }
  function isKakaoAllowedEnv(){
    var h=(location.hostname||'').toLowerCase();
    if(h==='localhost' || h==='127.0.0.1') return true;
    if(location.protocol!=='https:') return false;   // file:// · http:// 는 카카오가 거부한다
    for(var i=0;i<ALLOWED_HOSTS.length;i++){ if(normHost(ALLOWED_HOSTS[i])===h) return true; }
    return false;
  }
  function canUseKakao(){ return kakaoReady() && isKakaoAllowedEnv(); }
  // 카톡·인스타 등 인앱브라우저는 navigator.share 가 없거나 엉뚱하게 동작한다 → 공유시트를 건너뛴다.
  // (카카오 SDK 는 오히려 인앱브라우저에서 가장 잘 동작하므로 위 게이팅에는 쓰지 않는다)
  function isInAppBrowser(){
    return /KAKAOTALK|Instagram|FBAN|FBAV|FB_IAB|Line\/|NAVER|DaumApps|Band|; wv\)/i.test(navigator.userAgent||'');
  }
  function isMobile(){ return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||''); }

  // ---------- 카톡 텍스트 전송 (버튼 클릭 → 친구 선택창 즉시) ----------
  // 카카오 공유 API 는 링크가 필수다. 그 링크(자세히 보기)를 툴이 아니라
  // "메시지를 이미지 카드로 보여주는 페이지(m.html)"로 돌려서, 고객이 눌러도 툴은 노출되지 않게 한다.
  // 본문(text)은 그대로 텍스트 말풍선으로 전달된다. 카카오 text 템플릿은 200자 제한.
  function cardUrl(msg, cat){
    var dir=(location.origin+location.pathname).replace(/[^\/]*$/,''); // 현재 폴더 (…/oroji-message-tool/)
    var m=meta(cat);
    // m.html 이 카테고리 색으로 카드를 그리도록 배경 그라데이션(a,b)·따옴표 색(q)을 같이 실어 보낸다.
    var payload=JSON.stringify({ t:msg, a:m.d1, b:m.d2, q:m.g1 });
    var enc; try{ enc=btoa(unescape(encodeURIComponent(payload))); }catch(e){ enc=encodeURIComponent(msg); }
    return dir+'m.html#'+enc;
  }
  function sendText(msg, cat){
    if(!msg) return;
    // (A) 200자 초과 → 카카오 text 한도 초과. 잘려 나가면 최악이라 복사로 우회.
    if(msg.length>KAKAO_TEXT_MAX){
      copyText(msg,function(){ toast(KAKAO_TEXT_MAX+'자 초과라 복사했어요! 카톡에 붙여넣어 보내주세요'); });
      return;
    }
    // (B) 카카오 → 친구(채팅) 선택창 즉시. link 를 비워 "자세히 보기" 버튼 없이 순수 텍스트 말풍선으로 전송.
    if(canUseKakao()){
      try{
        Kakao.Share.sendDefault({ objectType:'text', text:msg, link:{} });
        return;
      }catch(e){}
    }
    // (C) 폴백: 모바일 OS 공유시트 (순수 텍스트)
    if(isMobile() && navigator.share && !isInAppBrowser()){
      navigator.share({text:msg}).catch(function(){ /* 사용자 취소 등 무시 */ });
      return;
    }
    // (D) 최종 폴백: 클립보드 복사
    copyText(msg,function(){ toast('메시지를 복사했어요! 카톡 대화창에 붙여넣기 하세요'); });
  }

  sendEl.onclick=function(){
    if(!curShare) return;
    var msg=curShare.text;

    // (A) 200자 초과 → 잘린 메시지가 고객에게 가는 것이 최악이므로 카톡 전송을 막고 복사로 우회.
    //     모달은 열어둔다. 빨간 카운터가 남아 있어야 멘트를 줄일 수 있다.
    if(msg.length>KAKAO_TEXT_MAX){
      showHint('카톡 직접 전송은 '+KAKAO_TEXT_MAX+'자까지예요. 멘트를 줄이시거나, 복사해서 붙여넣어 보내주세요.');
      copyText(msg,function(){ toast('길어서 복사했어요! 카톡에 붙여넣어 보내주세요'); });
      return;
    }

    // (B) 카카오 SDK → 친구(채팅) 선택창이 바로 열린다.
    //     link 를 비워야 "자세히 보기" 버튼 없이 순수 텍스트 말풍선으로 도착한다.
    //     sendDefault 는 user gesture 안에서 동기 호출해야 팝업이 차단되지 않는다.
    if(canUseKakao()){
      try{
        Kakao.Share.sendDefault({ objectType:'text', text:msg, link:{} });
        // 성공 콜백이 없어 전송 여부를 알 수 없다. 모달을 닫지 않고 복사 탈출구를 남긴다.
        showHint('친구 선택창이 안 뜨면 팝업 차단을 확인하시고, 아래 [복사]로 붙여넣어 보내주세요.');
        return;
      }catch(e){
        // 여기로 오는 것은 link:{} 거부 같은 동기 파라미터 오류뿐이다.
        // 도메인 미등록 실패는 throw 되지 않으므로 위 isKakaoAllowedEnv() 로 미리 걸러야 한다.
      }
    }

    // (C) OS 공유시트 → 카톡 선택. 순수 텍스트로 도착하고 길이 제한이 없다.
    if(navigator.share && !isInAppBrowser()){
      navigator.share({text:msg})
        .then(function(){ modalEl.classList.remove('show'); })
        .catch(function(){ /* 사용자 취소 등 무시 */ });
      return;
    }

    // (D) 최종 폴백: 클립보드 복사
    copyText(msg,function(){ toast('메시지를 복사했어요! 카톡에 붙여넣어 보내주세요'); });
    modalEl.classList.remove('show');
  };
  // 복사 버튼
  downEl.onclick=function(){ if(!curShare) return; copyText(curShare.text,function(){ toast('복사됐어요!'); }); };
  closeEl.onclick=function(){ modalEl.classList.remove('show'); };
  modalEl.onclick=function(e){ if(e.target===modalEl) modalEl.classList.remove('show'); };

  // ---------- 복사 ----------
  function copyText(str,cb){
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(str).then(cb,function(){legacy(str,cb);}); }
    else legacy(str,cb);
  }
  function legacy(str,cb){ var ta=document.createElement('textarea'); ta.value=str; ta.style.position='fixed'; ta.style.top='-9999px';
    document.body.appendChild(ta); ta.focus(); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); cb&&cb(); }

  var tT;
  function toast(msg){ toastTxt.textContent=msg||'완료'; toastEl.classList.add('show'); clearTimeout(tT); tT=setTimeout(function(){ toastEl.classList.remove('show'); },1700); }

  // ---------- 입력 ----------
  agentEl.oninput=function(){ try{ localStorage.setItem(K_AGENT, agentEl.value.trim()); }catch(e){} render(); };
  clientEl.oninput=function(){ render(); };
  searchEl.oninput=function(){ state.q=searchEl.value; editingId=null; render(); };

  render();
})();
</script>

</body>
</html>
